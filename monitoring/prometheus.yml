global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'latandad_tendermint'
    static_configs:
      - targets: ['localhost:26660']

  - job_name: 'latandad_cosmos_sdk'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:1317']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
